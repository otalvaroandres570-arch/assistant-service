server:
  port: 8082

spring:
  application:
    name: assistant-service
  ai:
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 500ms
        max-interval: 2s
    google:
      genai:
        # Gemini Developer API (key from Google AI Studio).
        # Do NOT set project-id or location here: that switches the client to Vertex AI.
        # The fallback lets the service start without a key; calls then fail and the service degrades.
        api-key: ${GEMINI_API_KEY:not-configured}
        # Both property styles are declared; the one that does not exist is ignored.
        chat:
          model: ${GEMINI_CHAT_MODEL:gemini-3.5-flash}
          temperature: 0.0
          options:
            model: ${GEMINI_CHAT_MODEL:gemini-3.5-flash}
            temperature: 0.0
        embedding:
          api-key: ${GEMINI_API_KEY:not-configured}
          text:
            model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
            options:
              model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

